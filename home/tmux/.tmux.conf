# tmux config. Linked to ~/.tmux.conf by bootstrap_mac.sh (stow). Reload inside tmux: prefix r

# Prefix: C-a is easier to reach than C-b. C-a C-a sends a literal C-a to the shell.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal behaviour
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true color in iTerm2
set -g mouse on
set -sg escape-time 10          # no delay after Esc (matters for vim)
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on

# Numbering: start at 1, keep windows contiguous when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode: vi keys, y copies to the macOS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Status bar: minimal, session name left, time right
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold][#S] "
set -g status-left-length 30
set -g status-right "%a %d %b %H:%M"
setw -g window-status-current-style "bold,reverse"
