# Starship prompt. Linked to ~/.config/starship.toml by bootstrap_mac.sh (stow).
# Docs: https://starship.rs/config/

# Line 1: host (ssh only), directory, git. Line 2: arrow, green on success, red on failure.
format = """
$hostname$directory$git_branch$git_commit$git_state$git_status$python$golang
$character"""

# Right side: how long the last command took, and the current time.
right_format = "$cmd_duration$time"

# Continuation prompt (PS2) for unclosed quotes, trailing backslash, loops.
continuation_prompt = "[❯❯](dimmed white) "

add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[hostname]
ssh_only = true
format = "[$hostname](bold yellow) "

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true

[git_branch]
style = "purple"
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "  # Nerd Font glyph (font-jetbrains-mono-nerd-font in Brewfile)

[git_commit]
tag_disabled = false
only_detached = true
format = "[\\($hash$tag\\)](green) "

[git_state]
# rebase / merge / cherry-pick in progress, with step counter
format = "[\\($state( $progress_current/$progress_total)\\)](bold yellow) "

[git_status]
# ⇡2 ahead, ⇣1 behind, ⇕ diverged, +N staged, !N modified, ?N untracked, »N renamed, ✘N deleted, =N conflicted, $N stashed
style = "red"
format = "([$ahead_behind$conflicted$staged$modified$renamed$deleted$untracked$stashed]($style) )"
ahead = "[⇡${count}](green)"
behind = "[⇣${count}](yellow)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](yellow)"
conflicted = "=${count}"
staged = "[+${count}](green)"
modified = "!${count}"
renamed = "»${count}"
deleted = "✘${count}"
untracked = "?${count}"
stashed = "[\\$${count}](dimmed white)"

[python]
format = "[${symbol}${version}( \\($virtualenv\\))]($style) "
style = "yellow"

[golang]
format = "[$symbol($version )]($style)"
style = "cyan"

[cmd_duration]
min_time = 2_000
format = "[took $duration](dimmed yellow) "

[time]
disabled = false
format = "[$time](dimmed white)"
time_format = "%H:%M"
