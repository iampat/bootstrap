# Starship prompt. Linked to ~/.config/starship.toml by bootstrap_mac.sh (stow).
# Docs: https://starship.rs/config/

# Line 1: time, host (ssh only), full path, git. Line 2: arrow, green on success, red on failure.
format = """
$time$hostname$directory$git_branch$git_commit$git_state$git_status
$character"""

# Continuation prompt (PS2) for unclosed quotes, trailing backslash, loops.
continuation_prompt = "[❯❯](dimmed white) "

add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[hostname]
ssh_only = true
format = "[$hostname](bold yellow) "

[directory]
style = "bold cyan"
truncation_length = 0
truncate_to_repo = false

[git_branch]
style = "purple"
format = "[\\[$branch\\]]($style) "

[git_commit]
tag_disabled = false
only_detached = true
format = "[\\($hash$tag\\)](green) "

[git_state]
# rebase / merge / cherry-pick in progress, with step counter
format = "[\\($state( $progress_current/$progress_total)\\)](bold yellow) "

[git_status]
# ⇡2 ahead, ⇣1 behind, ⇕ diverged, + staged, * modified, ? untracked, » renamed, ✘ deleted, = conflicted, $ stashed
style = "red"
format = "([$ahead_behind$conflicted$staged$modified$renamed$deleted$untracked$stashed]($style) )"
ahead = "[⇡${count}](green)"
behind = "[⇣${count}](yellow)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](yellow)"
conflicted = "="
staged = "[+](green)"
modified = "*"
renamed = "»"
deleted = "✘"
untracked = "?"
stashed = "[\\$](dimmed white)"

[time]
disabled = false
format = "[$time](dimmed white) "
time_format = "%Y-%m-%d %H:%M"
